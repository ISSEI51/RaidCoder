  - id: "RC-UX-002"
    project: "RaidCoder"
    title: "CE になった原因が提出結果から分からない"
    state: "discovery"
    priority:
      impact: 3
      urgency: 3
      confidence: 4
      ease: 3
      override: null
    evidence: "judge-bridge は Judge0 の compile_output を保存せず、submissions にも該当列がない。web/src/app/submissions/[id]/page.tsx はステータスバッジのみを表示するため、CE の理由が利用者に一切伝わらない。Judge0 CE v1.13.1 の言語は古い(Python 3.8 / Rust 1.40 / TypeScript 3.7 / Java 13)ため CE は起こりやすい。なお言語バージョン自体は提出画面の言語セレクタに表示済み(web/src/lib/languages.ts の label)"
    acceptance_conditions:
      - "CE の実発生率を submissions の status 集計で確認する"
      - "コンパイルエラー本文を保存・表示する案と、CE 時に定型の注意文を出す案を比較して結論を1つ出す"
    out_of_scope: "Judge0 のバージョンアップ作業"
    owner: null
    next_action: "CE の発生件数を集計し、対応方針を1案に絞る"
    blocker: null
    updated_at: "2026-08-25T16:05:21Z"

  - id: "RC-BAL-001"
    project: "RaidCoder"
    title: "アクティブ1〜2人のときボスHPが討伐不能になる"
    state: "discovery"
    priority:
      impact: 3
      urgency: 2
      confidence: 2
      ease: 3
      override: null
    evidence: "ボスHP = 20000 × アクティブ人数(最低3)。基礎ダメージ合計は1人あたり 21000(S8500+A5500+B3500+C2000+D1000+E500)で、ダメージは参加者ごとに加算されるため N 人なら 21000N ≧ 20000N となり、3人以上なら全問 AC で討伐可能。問題になるのは最低3のフロアが効く 1〜2人のときで、1人では最大 21000 × 1.3 × 1.5 = 40950 に対し HP 60000 となり討伐できない"
    acceptance_conditions:
      - "アクティブ1人・2人のときの理論最大ダメージと boss_max_hp を比較した数値を出す"
      - "フロア値(最低3)を下げるか、少人数時のHP式を変えるか、据え置くかの結論を1つ出す"
    out_of_scope: "ダメージ計算式そのものの再設計"
    owner: null
    next_action: "1人・2人のときの理論最大ダメージを算出し、フロア値の扱いを決める"
    blocker: null
    updated_at: "2026-08-25T16:05:21Z"

